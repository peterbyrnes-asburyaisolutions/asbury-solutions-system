; Axiometa Genesis Mini — Agentic Operating System (AOS) firmware
; Board: ESP32-S3-Mini-1-N4R2 (4 MB flash, 2 MB Quad PSRAM)

[env:genesis_mini]
platform = espressif32 @ ^6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv
board_build.embed_files = data/cert/x509_crt_bundle.bin

build_flags =
  -DAOS_VERSION=\"0.2.0\"
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -std=gnu++17
  -I${PROJECT_DIR}/../../bridge/firmware

build_unflags =
  -std=gnu++11

lib_deps =
  bblanchon/ArduinoJson @ ^7.4.3
  adafruit/Adafruit NeoPixel @ ^1.15.5
  greiman/SdFat @ ^2.3.1

; sync_client.cpp symlinked into src/; headers via -I bridge/firmware

[env:native]
platform = native
build_flags =
  -std=c++17
  -I${PROJECT_DIR}/../../bridge/firmware
  -DUNIT_TEST
test_build_src = false
build_src_filter = -<*>
