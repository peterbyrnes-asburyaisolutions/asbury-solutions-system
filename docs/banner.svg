<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
<!--
  ═══════════════════════════════════════════════════════════════════════
  OPERATION HIRED · DESIGN LANE · D7 · README HERO BANNER v1
  Owner: creative-director (Delacroix) · 2026-08-23 · Harbor Grit · zero slop
  ═══════════════════════════════════════════════════════════════════════

