      .surface { fill: #FFFFFF; }
      .line    { stroke: #161616; stroke-width: 2; }
      .headline{ font-family: "Archivo Black", "Arial Black", sans-serif; font-weight: 900; }
      .mono    { font-family: "IBM Plex Mono", "Courier New", monospace; }
