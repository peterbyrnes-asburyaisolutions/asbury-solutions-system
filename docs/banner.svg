  </defs>

  <!-- canvas -->
  <rect class="paper" width="1200" height="240"/>
  <rect class="line" fill="none" x="6" y="6" width="1188" height="228"/>

  <!-- hard offset shadow under white identity plate -->
  <rect x="868" y="60" width="288" height="120" fill="#171717"/>
  <rect class="surface" x="864" y="56" width="288" height="120"/>
  <rect class="signal" x="864" y="56" width="6" height="120"/>

  <!-- LEFT: brand lockup -->
  <text class="headline" x="56" y="112" font-size="52" letter-spacing="-1">ASBURY SOLUTIONS</text>
