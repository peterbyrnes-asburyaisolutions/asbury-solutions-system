  <rect class="line" fill="#F2EFE8" x="48" y="198" width="1104" height="28"/>
  <text class="mono" x="58" y="217" font-size="13" fill="#111111">SYSTEM ARCHITECTURE · DESIGN DECISIONS · STACK</text>
  <text class="mono" x="820" y="217" font-size="13" fill="#5A5A5A">ZERO FABRICATION · MIT LICENSE</text>
